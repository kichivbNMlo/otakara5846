<script>
/* 自動アップデート(暗号化版): 開くたびにGitHubの最新版を確認して、新しければ入れ替える。ネットがなければこのファイルのまま遊べる */
(function(){
  var BASE='https://kichivbnmlo.github.io/otakara5846/';   // ← GitHub PagesのURL(リポジトリ名を変えたらここも直す)
  var K_HTML='pirate-rush-latest', K_ENC='pirate-rush-enc', K_PW='pirate-rush-pw', t0=Date.now(), prompted=false;
  var S='<!'+'--BOOT-->', E='<!'+'--/BOOT-->';
  if(/github\.io$/.test(location.hostname)) return;          // GitHub上で開いたときは何もしない
  function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; }}
  function strip(h){var a=h.indexOf(S),b=h.indexOf(E);return(a>=0&&b>a)?h.slice(0,a)+h.slice(b+E.length):h;}
  function show(h){document.open();document.write(h);document.close();}
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function decrypt(enc,pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.s),iterations:enc.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.i)},key,b64(enc.d));
    }).then(function(buf){return new TextDecoder().decode(buf);});
  }
  function tryDecrypt(enc,pw,tries){
    if(!pw){
      prompted=true;
      pw=window.prompt(tries?'パスワードが違います。もう一度入力してください':'ゲームのパスワードを入力してください');
      if(!pw) return Promise.reject('cancel');
    }
    return decrypt(enc,pw).then(function(h){ls(K_PW,pw);return h;},function(){
      ls(K_PW,null);
      if(tries>=2) return Promise.reject('bad');
      return tryDecrypt(enc,null,tries+1);
    });
  }
  function bad(h){return /game\.enc\?t=|pirate-rush-latest/.test(h);}   // 起動用ファイルを取り違えて暗号化した場合の検出
  var cached=ls(K_HTML);
  if(cached&&bad(cached)){ls(K_HTML,null);ls(K_ENC,null);cached=null;}   // 壊れた保存データは捨てる
  if(cached) show(cached);                                    // 前に取ってきた最新版をすぐ表示
  fetch(BASE+'game.enc?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(raw){
    if(raw===ls(K_ENC)) return;                               // 前と同じ版なら何もしない
    var enc=JSON.parse(raw);
    return tryDecrypt(enc,ls(K_PW),0).then(function(h){
      h=strip(h); if(h.indexOf('<canvas')<0||bad(h)) return;
      ls(K_HTML,h); ls(K_ENC,raw);
      if(prompted||Date.now()-t0<8000) show(h);               // 起動直後なら、その場で新しい版に切り替える
    });
  }).catch(function(){});
})();
</script>

function nearestFoe(u, range){
  let best = null, bd = range;

  return best ? {e:best,d:bd} : null;
}

function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy; let t = l2? ((px-x1)*dx+(py-y1)*dy)/l2 : 0;
  t = Math.max(0,Math.min(1,t)); return Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
}

  u.lock = total+.15; u.lockType='skill'; u.immuneT = Math.max(u.immuneT, total+.3); u.armorT = Math.max(u.armorT, total+.3);   // マリモ: スキル2発動中はよろけ/ダウン/吹っ飛ばし無効
  G.strikes.push({u, ang:u.face, len:200, t:0, dur:total+.1, kind:'asura'});
  addRing(u.x,u.y,20,r>=1?230:170,'rgba(125,255,178,.9)',.5);
  for(let k=0;k<n;k++) at(.1+k*.11, () => { if(ok()) strikeCircle(u,210,p,{fx:'stagger',skill:true}); });
  at(total, () => { if(ok()){
    strikeCircle(u,230,fin,{fx:'down',skill:true,extra:stored});
    if(stored>0) addText(u.x,u.y-96,'上乗せ +'+stored,'#7dffb2',20,1.2);
    addRing(u.x,u.y,30,260,'rgba(125,255,178,.95)',.5);
  }});
  aiDodgeHint(u,.1);
}
function skillDown(u,i){
  if(NET.mode==='guest'){ netSend({t:'c',k:'sd',i}); return; }
  if(CH[u.char].charge===i) startCharge(u,i); else useSkill(u,i);
}
function skillUp(u,i){ if(NET.mode==='guest'){ netSend({t:'c',k:'su',i}); return; } if(u.charging && u.charging.i===i) releaseCharge(u); }
function aiDodgeHint(u, delay){
  for(const e of foes(u)){
    if(e.isPlayer || e.remote || e.dodgeCd>0 || dist(u,e)>430 || Math.random()>.15) continue;
    at(Math.max(0, delay - .04 - Math.random()*.5), () => tryDodge(e));   // 回避のタイミングをバラつかせて、ジャスト回避や空振りになりやすくしない
  }
}
function tryDodge(u){
  if(NET.mode==='guest'){ netSend({t:'c',k:'dg'}); return false; }
  if(u.ko || u.down>0 || u.dodgeCd>0 || u.dodgeT>0 || u.vib>0 || (u.charging && u.charging.kind==='flame')) return false;   // 道を空けろ!の長押し中は回避もできない
  u.dodgeT = DODGE_T; u.dodgeCd = 5; u.justDone = false; u.stun = 0; interrupt(u);
  if(u.char==='rubber3' && u.big){ u.ddx=u.ddy=0; addRing(u.x,u.y,20,80,'rgba(255,255,255,.9)',.3); addText(u.x,u.y-70,'ガード','#ffffff',16,.6); return true; }   // 巨人化: 回避がガードに変化
  let mx=u.mvx, my=u.mvy;
  if(Math.hypot(mx,my)<.1){ mx=-Math.cos(u.face); my=-Math.sin(u.face); }
  const l=Math.hypot(mx,my)||1; u.ddx=mx/l; u.ddy=my/l;
  addRing(u.x,u.y,30,50,'rgba(255,255,255,.35)',.25);
  return true;
}
function justDodge(t, atk){
  t.justDone = true; t.dodgeCd = Math.min(t.dodgeCd, 1);
  if(t.char==='rubber3' && t.big){ heal(t,t.maxHp*.3); addText(t.x,t.y-70,'ジャストガード!','#ffffff',26,1); addRing(t.x,t.y,20,130,'rgba(255,255,255,.95)',.5); if(t.isPlayer) G.slow=.7; return; }   // ジャストガード: 体力30%回復
  addText(t.x,t.y-60,'JUST!','#9ff3ff',26,.9);
  addRing(t.x,t.y,20,110,'rgba(120,240,255,.95)',.5);
  if(t.isPlayer) G.slow = .7;
  if(t.char==='hikari' && atk && !atk.ko && atk.team!==t.team){   // 光男: 攻撃してきた敵へ瞬間移動して最大体力30%ダメージ+吹っ飛ばし
    const ang = Math.atan2(atk.y-t.y, atk.x-t.x);
    addRing(t.x,t.y,10,80,'rgba(255,240,160,.95)',.35);
    t.x = Math.max(30,Math.min(WW-30, atk.x-Math.cos(ang)*60)); t.y = Math.max(30,Math.min(WH-30, atk.y-Math.sin(ang)*60)); t.face = ang;
    addRing(t.x,t.y,10,110,'rgba(255,240,160,.95)',.45);
    applyHit(t, atk, 0, {flat:Math.round(atk.maxHp*.3), fx:'blow', pct:true});
    t.cd[1] *= .5; addText(t.x,t.y-80,'瞬閃!','#fff3a0',24,1);
  }
  if(t.char==='swords'){                         // 三刀流: ジャスト回避で紫の斬撃(最大3ヒット)
    const L = foes(t).filter(e => dist(t,e)<420).sort((a,b)=>dist(t,a)-dist(t,b));
    if(!L.length) return;
    for(let k=0;k<3;k++){
      const e = L[k%L.length];
      at(.06*k, () => { if(t.ko) return;
        const ang = Math.atan2(e.y-t.y,e.x-t.x) + (L.length<3?(k-1)*.12:0);
        spawnProj(t,ang,0,{flat:Math.round(t.maxHp*.05),pct:true},{speed:1100,life:.45,r:34,color:'#b36bff'});
      });
    }
  }
}
function pressFlag(u){
  if(NET.mode==='guest'){ netSend({t:'c',k:'fl'}); return true; }

  u.cap = {area:a, phase:'run'}; u.comboWin=0;

  if(u.char==='rubber3' && u.big){ sfx('gomuArea',u); a.gomu = {u, t:0}; addText(a.x,a.y-70,'ゴムゴムお宝エリア!','#ffffff',22,1.5); addRing(a.x,a.y,20,a.r,'rgba(255,255,255,.9)',.6); }   // 巨人化: ゴムゴムお宝エリア
  return true;
}
function onCaptureStart(u, a){

    G.units.forEach(m => { if(m.team===a.owner && !m.ko && m.char==='swords'){ m.spdUp=5; addText(m.x,m.y-80,'速度UP','#7dffb2',18,1); } });
  }
}

/* オー: エリア内にいる間に敵のお宝ゲージが減った分を数え、10%ごとに防御+15%(最大50%) */
function ohCredit(a, dec){
  if(!(dec>0) || a.capTeam===null) return;
  for(const u of G.units){
    if(u.ko || u.char!=='oh' || a.capTeam===u.team || Math.hypot(u.x-a.x,u.y-a.y)>=a.r) continue;
    ohAdd(u,dec);
  }
}
function ohAdd(u, dec){
  u.ohAcc=(u.ohAcc||0)+dec; const nd=Math.min(.5, Math.floor(u.ohAcc/.1+1e-6)*.15);
  if(nd>(u.ohDef||0)){ u.ohDef=nd; addText(u.x,u.y-90,'防御UP','#8fd3ff',16,1); addRing(u.x,u.y,10,70,'rgba(143,211,255,.9)',.4); }
}
/* ---------- お宝エリア ---------- */
function updateAreas(dt){
  for(const a of G.areas){
    a.lock = Math.max(0,a.lock-dt);
    if(a.gomu){                                        // ゴムゴムお宝エリア: 2秒ごとに敵へ最大体力15%ダメージ、10%で振動5秒
      const g=a.gomu;
      if(!g.u || g.u.ko || !(g.u.cap && g.u.cap.area===a)) a.gomu=null;
      else{
        g.t+=dt;
        if(g.t>=2){ g.t=0; addRing(a.x,a.y,10,a.r,'rgba(255,255,255,.9)',.5);
          for(const e of foes(g.u)){ if(Math.hypot(e.x-a.x,e.y-a.y)>=a.r) continue;
            applyHit(g.u,e,0,{flat:Math.round(e.maxHp*.15),pct:true});
            if(!e.ko && e.char!=='rubber3' && e.char!=='oh' && Math.random()<.1){ e.vib=ail(e,5); e.cap=null; interrupt(e); addText(e.x,e.y-90,'振動!','#ffffff',22,1.2); } } }
      }
    }
    let caps = G.units.filter(u => !u.ko && u.cap && u.cap.phase==='cap' && u.cap.area===a);
    if(caps.length && enemyInArea(a,caps[0].team)){          // 黒足は敵がいても奪取を続けられる
      caps.forEach(u => { if(!ignoreFoes(u,a)) u.cap=null; });
      caps = caps.filter(u => u.cap);
    }
    if(caps.length){
      const team = caps[0].team;
      const rates = caps.map(u=>CH[u.char].capMul).sort((x,y)=>y-x);
      const total = rates[0] + rates.slice(1).reduce((s,x)=>s+x*.5,0);
      if(a.owner!==null && a.owner!==team){            // 敵が持つお宝: 奪取するとお宝ゲージが減り、0になったら奪取成功
        const d = Math.min(a.gauge, dt*total/7);
        a.gauge -= d;
        caps.forEach(u => { if(u.char==='oh') ohAdd(u, d); });   // オー: 敵のお宝ゲージを減らすたびに防御UP
        if(a.gauge<=1e-6){ a.gauge=0; a.capTeam=team; a.prog=1; }
      } else {
        if(a.capTeam!==team){ ohCredit(a,a.prog); a.capTeam=team; a.prog=0; }   // 奪い返して敵のゲージが0になった分もオーの防御に数える
        a.prog += dt * total / 7;
      }
    } else {
      let mul = 1;                                   // ディフェンダーは自陣のゲージ回復が速い
      if(a.owner!==null) for(const u of G.units){ if(!u.ko && u.team===a.owner && Math.hypot(u.x-a.x,u.y-a.y)<a.r) mul=Math.max(mul,CH[u.char].capMul); }
      ohCredit(a, Math.min(a.prog, dt*.5*mul));              // オー: 敵のお宝ゲージが減るたびに数える
      a.prog = Math.max(0, a.prog - dt*.5*mul);
    }
    if(a.prog >= 1){
      a.owner = a.capTeam; a.prog = 0; a.gauge = .5; a.lock = 5;   // 奪取直後のお宝ゲージは50%
      G.score[a.owner] += 500;
      addText(a.x,a.y-40,'お宝奪取! +500',tcol(a.owner),30,1.6);
      addRing(a.x,a.y,40,a.r+60,tcol(a.owner),.8);
      G.units.forEach(u => { if(u.char==='rubber3' && !u.big && !u.ko && u.cap && u.cap.area===a){ heal(u,u.maxHp*.3); addText(u.x,u.y-90,'奪取回復','#7dffb2',20,1.1); } });
      G.units.forEach(u => { if(u.cap && u.cap.area===a) u.cap=null; });
    }
    if(a.owner!==null){                                   // 自陣のお宝エリアにいるとゲージが貯まる(敵がいると貯まらない)
      const inA = u => !u.ko && u.team===a.owner && Math.hypot(u.x-a.x,u.y-a.y)<a.r;
      const mm = G.units.filter(u => inA(u) && (u.char==='swords' || u.char==='fire'));   // マリモ・炎拳の海賊: 上限50%超過 / 体力50%以上で敵を無視して回復
      const enemyCap = caps.length>0 && caps[0].team!==a.owner;                          // 敵に奪取されている最中は 炎拳の海賊の回復は無効
      const gcap = mm.length ? 1.5 : 1;                  // マリモがいると上限を50%超過できる(最大150%)
      const foe = enemyInArea(a,a.owner);
      if(a.gauge<gcap){
        const GR = {'ディフェンダー':.08, 'アタッカー':.03, 'ゲッター':.012};     // 1秒あたり: ディフェンダー > アタッカー(遅め) > ゲッター(かなり遅い)
        // 敵がいる時は、体力50%以上のマリモだけが敵を無視して貯められる
        const src = foe ? mm.filter(u => u.hp>=u.maxHp*.5 && !(u.char==='fire' && enemyCap)) : G.units.filter(inA);
        const rs = src.map(u=>GR[CH[u.char].role]||.03).sort((x,y)=>y-x);
        if(rs.length) a.gauge = Math.min(gcap, a.gauge + dt*(rs[0] + rs.slice(1).reduce((q,x)=>q+x*.5,0)));
      }
    }
    if(a.owner!==null) G.score[a.owner] += 6*dt;
  }
}

/* ---------- AI ---------- */
function aiThink(u){
  u.mvx=u.mvy=0;
  if(u.charging){
    if(u.charging.kind==='dig'){                       // 地中を敵へ向かって移動 → 近づいたら岩を吐く
      const m = nearestFoe(u,1400);
      if(m){ const dx=m.e.x-u.x, dy=m.e.y-u.y, l=Math.hypot(dx,dy)||1; u.mvx=dx/l; u.mvy=dy/l; u.face=Math.atan2(dy,dx); }
      if(u.charging.t>=.5 && ((m && m.d<200) || u.charging.t>=u.aiRel+1)) releaseCharge(u);
      return;
    }
    if(u.charging.kind==='rocket'){ if(u.charging.t>=u.aiRel) releaseCharge(u); return; }
    const n = nearestFoe(u,300);
    if(u.charging.t>=u.aiRel || (!n && u.charging.t>.6)) releaseCharge(u);
    return;
  }
  if(!canAct(u,'normal') && !(u.lock>0)) return;
  const n = nearestFoe(u, 400);
  if(u.char==='oh' && u.ctrT>0) return;                       // オー: カウンター待機中は動かない
  if(u.char==='kuro' && u.kctr>0) return;                     // 闇震の船長: カウンター待機中は動かない
  if(u.char==='oh' && u.cap && u.cap.phase==='cap' && n && n.d<420 && useSkill(u,1)) return;   // 奪取中に敵が近づいたらROOM・切断
  if(u.cap){
    if(n && n.d<260 && !ignoreFoes(u,u.cap.area)) u.cap=null; else return;
  }
  if(u.char==='sanji'||u.char==='songkus'||u.char==='oh'){        // 黒足/ソンクスAI: 敵のお宝エリアでは敵を無視して奪取開始
    const ar = areaAt(u);
    if(ar && ignoreFoes(u,ar) && !u.cap && ar.lock<=0 && pressFlag(u)) return;
  }
  if(u.char==='rubber3'){                               // AI: 巨人化 ⇔ 通常の切り替え
    if(!u.big && n && n.d<420 && Math.random()<.05 && rubber3Toggle(u)) return;
    if(u.big && !n && Math.random()<.04 && rubber3Toggle(u)) return;
  }
  if(n){
    u.face = Math.atan2(n.e.y-u.y, n.e.x-u.x);
    if(u.char==='rubber'){
      if(u.cd[0]<=0 && n.d<340 && Math.random()<.5) { useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<300 && Math.random()<.5) { useSkill(u,1); return; }
      if(n.d<170){ tryNormal(u); return; }
    } else if(u.char==='rubber3'){
      if(u.cd[1]<=0 && n.d<(u.big?700:380) && Math.random()<.5) { useSkill(u,1); return; }
      const hasEnemyArea = G.areas.some(a => a.owner!==null && a.owner!==u.team);
      if(u.cd[0]<=0 && (u.big ? n.d>260 : (hasEnemyArea || n.d<250)) && Math.random()<.3){
        if(startCharge(u,0)){ u.aiRel = u.big ? .8+Math.random()*2.5 : Math.random()*3.2; return; } }
      if(n.d<(u.big?330:170)){ tryNormal(u); return; }
    } else if(u.char==='hikari'){
      if(u.combo2T>0 && n.d>100 && n.d<520 && Math.random()<.6) { useSkill(u,1); return; }
      if(u.cd[0]<=0 && n.d<420 && Math.random()<.5) { useSkill(u,0); return; }
      if(u.cd[1]<=0 && !(u.combo2T>0) && Math.random()<.3 && useSkill(u,1)) return;
      if(n.d<170){ tryNormal(u); return; }
    } else if(u.char==='rubber2'){
      if(u.cd[0]<=0 && n.d>150 && n.d<540 && Math.random()<.5) { useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<340 && Math.random()<.5) { useSkill(u,1); return; }
      if(n.d<170){ tryNormal(u); return; }
    } else if(u.char==='songkus'){
      if(u.cd[0]<=0 && n.d>150 && n.d<1100 && Math.random()<.45) { useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<400 && Math.random()<.5) { useSkill(u,1); return; }
      if(n.d<190){ tryNormal(u); return; }
    } else if(u.char==='hornkey'){
      if(u.cd[1]<=0 && n.d>120 && n.d<520 && Math.random()<.5){ useSkill(u,1); return; }
      if(u.cd[0]<=0 && n.d<560 && Math.random()<.5){ useSkill(u,0); return; }
      if(n.d<200){ tryNormal(u); return; }
    } else if(u.char==='oh'){
      if(u.cd[0]<=0 && n.d<520 && Math.random()<.45){ useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d>140 && n.d<600 && Math.random()<.45){ useSkill(u,1); return; }
      if(n.d<240){ tryNormal(u); return; }
    } else if(u.char==='kuro'){
      if((u.pg||0)>=5 && n.d<600 && Math.random()<.5){ useSkill(u,Math.random()<.5?0:1); return; }
      if(u.combo===1 && u.comboWin>0 && Math.random()<.3 && kuroArm(u)) return;
      if(u.cd[0]<=0 && n.d>140 && n.d<560 && Math.random()<.45){ useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<300 && Math.random()<.45){ useSkill(u,1); return; }
      if(n.d<200){ tryNormal(u); return; }
    } else if(u.char==='fire'){
      if(u.cd[0]<=0 && n.d>150 && n.d<560 && Math.random()<.45){ useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<230 && Math.random()<.5){ if(startCharge(u,1)) u.aiRel=.8+Math.random()*4.2; return; }
      if(n.d<210){ tryNormal(u); return; }
    } else if(u.char==='sanji'){
      if(u.cd[1]<=0 && n.d>180 && n.d<480 && Math.random()<.4) { useSkill(u,1); return; }
      if(u.cd[0]<=0 && n.d<230 && Math.random()<.5) { useSkill(u,0); return; }
      if(n.d<170){ tryNormal(u); return; }
    } else {
      if(u.cd[0]<=0 && n.d>160 && n.d<480 && Math.random()<.4) { useSkill(u,0); return; }
      if(u.cd[1]<=0 && n.d<230 && Math.random()<.5){
        if(startCharge(u,1)){ if(Math.random()<.5) u.aiRel = .6+Math.random()*3.6; else releaseCharge(u); }
        return;
      }
      if(n.d<340){ tryNormal(u); if(n.d>230) return; else return; }
    }
    u.mvx=Math.cos(u.face); u.mvy=Math.sin(u.face); return;
  }
  u.goalT -= .12;
  if(!u.goal || u.goalT<=0 || u.goal.owner===u.team){
    let best=null, bs=1e9;
    for(const a of G.areas){
      if(a.owner===u.team) continue;
      const mates = G.units.filter(m => m!==u && m.team===u.team && !m.ko && !m.isPlayer && !m.remote && m.goal===a).length;
      const s = Math.hypot(u.x-a.x,u.y-a.y) + mates*260;
      if(s<bs){bs=s;best=a;}
    }
    if(!best){                                    // すべて確保済みなら、敵陣に近い自陣エリアを守る
      const eb = BASES[1-u.team]; let bd=1e9;
      for(const a of G.areas){ const d=Math.hypot(a.x-eb.x,a.y-eb.y); if(d<bd){bd=d;best=a;} }
    }
    u.goal = best; u.goalT = 2;
  }
  const g = u.goal; if(!g) return;
  const d = Math.hypot(u.x-g.x,u.y-g.y);
  if(d < g.r-20){ pressFlag(u); }
  else{ u.mvx=(g.x-u.x)/d; u.mvy=(g.y-u.y)/d; }
}

/* ---------- 更新 ---------- */
function readInput(){                                     // このスマホ/PCの入力(キーボード+ジョイスティック+攻撃ボタン)
  let x=0,y=0;
  if(keys.has('a')||keys.has('arrowleft')) x-=1;
  if(keys.has('d')||keys.has('arrowright')) x+=1;
  if(keys.has('w')||keys.has('arrowup')) y-=1;
  if(keys.has('s')||keys.has('arrowdown')) y+=1;
  x += joyV.x; y += joyV.y;
  const l = Math.hypot(x,y); if(l>1){x/=l;y/=l;}
  return {x, y, a: !!(atkHeld || keys.has('j') || keys.has('z'))};
}
function inputCore(u, x, y, holdAtk){
  const l = Math.hypot(x,y); if(l>1){x/=l;y/=l;}
  u.mvx=x; u.mvy=y;
  if(l>.25 && u.cap) u.cap=null;
  if(holdAtk){ if(!u.holdSince) u.holdSince = G.t; } else u.holdSince = 0;
  if(holdAtk){

    if(u.char==='ryo' && u.combo===1 && u.comboWin>0 && G.t-u.holdSince>=.3 && ryoToggle(u)){ u.holdSince = G.t+999; return; }   // 両翼: 2段目で長押し → マリモ⇄黒足

function separate(){
  const L = G.units.filter(u=>!u.ko);
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i], b=L[j]; let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy);
    if(d>0 && d<UR*1.8){ const p=(UR*1.8-d)/2; dx/=d; dy/=d; a.x-=dx*p; a.y-=dy*p; b.x+=dx*p; b.y+=dy*p; }
  }
  for(const ob of G.obs) for(const u of L){                // 障害物: 通り抜けられない
    const dx=u.x-ob.x, dy=u.y-ob.y, d=Math.hypot(dx,dy), m=UR+ob.r;
    if(d<m){ const k=d>0?1/d:0; u.x=ob.x+(d>0?dx*k:1)*m; u.y=ob.y+(d>0?dy*k:0)*m; }
  }
}
function update(real){
  G.slow = Math.max(0, G.slow-real);
  const dt = real * (G.slow>0 ? .35 : 1);
  G.t += dt; G.time -= dt;
  for(const e of G.events.filter(e => G.t>=e.at)) e.fn();
  G.events = G.events.filter(e => G.t<e.at);
  for(const u of G.units) updateUnit(u,dt);
  updateProj(dt);
  for(const pl of G.pulls){                                    // 引き寄せ中: 闇に引かれて少しずつ近づく
    pl.el += dt; const t=pl.t;
    if(t.ko || pl.u.ko || pl.el>=pl.dur){ pl.done=true; continue; }
    const q=pl.el/pl.dur, e=1-(1-q)*(1-q);
    t.x=pl.sx+(pl.tx-pl.sx)*e; t.y=pl.sy+(pl.ty-pl.sy)*e; t.kx=t.ky=0; t.cap=null;
  }
  G.pulls = G.pulls.filter(p => !p.done);
  for(const ob of G.obs) ob.life-=dt;
  G.obs = G.obs.filter(ob => ob.hp>0 && ob.life>0);
  separate(); updateAreas(dt);
  for(const o of G.rings) o.t+=dt; G.rings = G.rings.filter(o=>o.t<o.life);
  for(const o of G.texts) o.t+=dt; G.texts = G.texts.filter(o=>o.t<o.life);
  for(const o of G.strikes) o.t+=dt; G.strikes = G.strikes.filter(o=>o.t<o.dur);
  if(G.time<=0){ G.time=0; endGame(); }
}

}

/* ===== ルーム(友達と遊ぶ): ホストのスマホ/PCがゲームを計算し、ゲストへ状態を送る ===== */
const NET_SKIP = new Set(['hits','dmgHits','hkh','r2h','digHits','goal','goalT','aiT','aiRel','hitSet','o','isPlayer','remote','nick','tx','ty','tface']);
const netIdOf = n => 'pirate-rush-v2-' + n;
function netEnc(v,d){                                  // 送れる形に変換(ユニット/エリアは id の参照に)
  if(v===null||v===undefined) return null;
  const t=typeof v;
  if(t==='number') return isFinite(v) ? Math.round(v*100)/100 : 0;
  if(t==='string'||t==='boolean') return v;
  if(t!=='object') return undefined;
  if(v instanceof Set||v instanceof Map) return undefined;
  if(d>3) return undefined;
  if(v.team!==undefined && v.char!==undefined && v.maxHp!==undefined) return {$u:v.id};
  if(v.gauge!==undefined && v.capTeam!==undefined && v.id!==undefined) return {$a:v.id};
  if(Array.isArray(v)){ const a = v.length>80 ? v.slice(-80) : v; return a.map(x=>{ const e=netEnc(x,d+1); return e===undefined?null:e; }); }
  const o={}; for(const k in v){ if(NET_SKIP.has(k)) continue; const e=netEnc(v[k],d+1); if(e!==undefined) o[k]=e; } return o;
}
function netDec(v){
  if(v && typeof v==='object'){
    if(Array.isArray(v)) return v.map(netDec);
    if(v.$u!==undefined) return G.units.find(u=>u.id===v.$u)||null;
    if(v.$a!==undefined) return G.areas.find(a=>a.id===v.$a)||null;
    const o={}; for(const k in v) o[k]=netDec(v[k]); return o;
  }
  return v;
}
function netSend(m){ const c=NET.conn; if(c && c.open){ try{ c.send(m); }catch(e){} } }
function netBusy(){ const c=NET.conn; try{ return !!(c && c.dataChannel && c.dataChannel.bufferedAmount>250000); }catch(e){ return false; } }
function netUnitDelta(u,full){                          // 前回から変わった項目だけ
  const prev = full ? (NET.sent[u.id]={}) : (NET.sent[u.id]||(NET.sent[u.id]={})), d={}; let n=0;
  for(const k in u){ if(NET_SKIP.has(k)) continue; const e=netEnc(u[k],0); if(e===undefined) continue; const js=JSON.stringify(e); if(prev[k]!==js){ d[k]=e; prev[k]=js; n++; } }
  return n ? d : null;
}
function netSnapshot(full){
  const m = {t:'s', gt:Math.round(G.t*100)/100, tm:Math.round(G.time*10)/10, sc:[Math.round(G.score[0]*10)/10, Math.round(G.score[1]*10)/10], u:[]};
  for(const u of G.units){ const d=netUnitDelta(u,full); if(d) m.u.push([u.id,d]); }
  m.ar=G.areas.map(ar=>{ const o={}; for(const k in ar){ const e=netEnc(ar[k],1); if(e!==undefined) o[k]=e; } return o; }); m.ob=netEnc(G.obs,0); m.pu=netEnc(G.pulls,0); m.st=netEnc(G.strikes,0); m.pj=netEnc(G.proj,0);
  if(G.dig){ m.dg={cr:netEnc(G.dig.cr,0), rg:netEnc(G.dig.rg,0), tr:netEnc(G.dig.tr.slice(-50),0)}; }
  if(NETH && NETH.length){ m.ev = NETH.slice(-300); NETH.length=0; }
  return m;
}
function hostTick(dt){                                  // ホスト: 約25回/秒でゲストへ状態を送る
  NET.acc += dt; if(NET.acc < .04) return;
  NET.acc = 0;
  if(!NET.conn || !NET.conn.open){ if(NETH && NETH.length>600) NETH.length=0; return; }
  if(netBusy()) return;
  NET.kf += .04; const full = NET.kf>=3; if(full) NET.kf=0;
  netSend(netSnapshot(full));
}
function netApplyUnit(id,d){
  const u=G.units.find(x=>x.id===id); if(!u) return;
  for(const k in d){
    if(NET_SKIP.has(k)) continue;
    if(k==='x'||k==='y'){ const T=k==='x'?'tx':'ty'; if(u[T]===undefined || Math.abs(d[k]-u[k])>260 || d.spawnT>0 || d.ko===false){ u[k]=d[k]; } u[T]=d[k]; continue; }
    u[k]=netDec(d[k]);
  }
  u.isPlayer = id===NET.youId;
  u.nick = u.isPlayer ? '' : (id===NET.hostId ? 'ホスト' : '');
}
function netApplySnap(m){
  G.t=m.gt; G.time=m.tm; G.score=m.sc;
  // お宝エリア: 参照が切れないように、同じオブジェクトを書き換える
  for(const a of (m.ar||[])){ let t=G.areas.find(x=>x.id===a.id); if(!t){ t={id:a.id}; G.areas.push(t); } for(const k in a){ if(k!=='gomu') t[k]=a[k]; } if(!a.gomu) delete t.gomu; }
  // ユニット: 先に全員を作ってから中身を入れる(お互いの参照を解決するため)
  for(const [id,d] of m.u){ if(!G.units.find(x=>x.id===id) && d.char!==undefined){ const nu=mkUnit(id,d.team,d.x,d.y,false,d.char); nu.tx=d.x; nu.ty=d.y; G.units.push(nu); } }
  for(const [id,d] of m.u) netApplyUnit(id,d);
  for(const a of (m.ar||[])){ if(a.gomu){ const t=G.areas.find(x=>x.id===a.id); t.gomu={u:netDec(a.gomu.u), t:a.gomu.t}; } }
  G.pl = G.units.find(u=>u.id===NET.youId) || G.pl;
  G.obs=netDec(m.ob)||[]; G.pulls=netDec(m.pu)||[]; G.strikes=netDec(m.st)||[]; G.proj=netDec(m.pj)||[];
  G.dig = m.dg ? {cr:netDec(m.dg.cr)||[], rg:netDec(m.dg.rg)||[], tr:netDec(m.dg.tr)||[]} : G.dig;
  if(m.ev){ for(const e of m.ev){
    switch(e[0]){
      case 'r': G.rings.push({x:e[1],y:e[2],r0:e[3],r1:e[4],color:e[5],t:0,life:e[6]}); break;
      case 'x': G.texts.push({x:e[1],y:e[2],s:e[3],color:e[4],size:e[5],t:0,life:e[6]}); break;
      case 'b': fxBurst(...e[1]); break;
      case 'd': fxState().d.push(e[1]); break;
      case 'fh': { const u=G.units.find(x=>x.id===e[1]); G.fireHits=(G.fireHits||[]); G.fireHits.push({x:e[2],y:e[3],t:0,life:.35,u}); break; }
      case 's': { const u=G.units.find(x=>x.id===e[2]); sfx(e[1],u||null,e[3]||undefined); break; }
    }
  } }
}
function guestStep(dt){                                 // ゲスト: 計算はせず、受け取った状態をなめらかに動かして描く
  G.t += dt;
  for(const u of G.units){ if(u.tx!==undefined){ const k=Math.min(1,dt*22); u.x+=(u.tx-u.x)*k; u.y+=(u.ty-u.y)*k; } }
  for(const p of G.proj){ p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(const o of G.rings) o.t+=dt; G.rings=G.rings.filter(o=>o.t<o.life);
  for(const o of G.texts) o.t+=dt; G.texts=G.texts.filter(o=>o.t<o.life);
  for(const o of G.strikes) o.t+=dt;
  G.time=Math.max(0,G.time-dt);
  NET.inAcc += dt;
  const r=readInput(), key=Math.round(r.x*20)+','+Math.round(r.y*20)+','+(r.a?1:0);
  if(key!==NET.lastIn || NET.inAcc>.25){ if(NET.inAcc>=.03 || key!==NET.lastIn && NET.inAcc>=.03){ NET.inAcc=0; NET.lastIn=key; netSend({t:'i',x:Math.round(r.x*100)/100,y:Math.round(r.y*100)/100,a:r.a}); } }
}
function netLeave(){
  try{ if(NET.conn) NET.conn.close(); }catch(e){}
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  NET.mode=null; NET.conn=null; NET.peer=null; NET.ru=null; NETH=null; NET.sent={}; NET.vs=false;
}
const roomMsg = (t,c) => { const e=$('rmsg'); if(e){ e.textContent=t; e.style.color=c||'var(--mute)'; } };
function netOpen(host, room){                           // ルームを作る / 入る
  netLeave(); NET.room=room; NET.mode=host?'host':'guest'; NET.gchar='rubber'; NET.vs=false;
  roomMsg('中継サーバーに接続中…(15秒たっても進まなければ、学校などの制限でブロックされています)');
  const timer=setTimeout(()=>roomMsg('中継サーバーに繋がりません。ネットワークが通信を止めている可能性があります。','var(--foe)'),15000);
  let peer; try{ peer = host ? new Peer(netIdOf(room)) : new Peer(); }catch(e){ roomMsg('通信を開始できませんでした','var(--foe)'); return; }
  NET.peer=peer;
  peer.on('error',e=>{ clearTimeout(timer); roomMsg('エラー: '+e.type+(e.type==='unavailable-id'?'(その番号は使用中です。別の番号にしてください)':e.type==='peer-unavailable'?'(その番号のルームがありません)':''),'var(--foe)'); });
  peer.on('open',()=>{
    clearTimeout(timer);
    if(host){ showLobby(); peer.on('connection',c=>{
        if(NET.conn && NET.conn.open){ try{ c.on('open',()=>c.close()); }catch(e){} return; }   // 2人目以降は断る
        NET.conn=c; netWire(c); }); }
    else{
      roomMsg('ルーム '+room+' を探しています…');
      const c=peer.connect(netIdOf(room),{reliable:true,serialization:'json'}); NET.conn=c; netWire(c);
      setTimeout(()=>{ if(!c.open) roomMsg('ルームに入れません。番号が違うか、通信がブロックされています。','var(--foe)'); },15000);
    }
  });
}
function netWire(c){
  let opened=false; const onOpen=()=>{ if(opened) return; opened=true; if(NET.mode==='guest'){ showLobby(); netSend({t:'pick',c:selected}); } else { showLobby(); netSend({t:'mode',vs:!!NET.vs}); } };
  c.on('open',onOpen); if(c.open) onOpen();
  c.on('data',m=>netRecv(m));
  c.on('close',()=>netClosed());
  c.on('error',()=>netClosed());
}
function netRecv(m){
  if(!m || typeof m!=='object') return;
  if(NET.mode==='host'){
    if(m.t==='pick' && CH[m.c]){ NET.gchar=m.c; const e=$('lstat'); if(e) lobbyStat(); }
    else if(m.t==='i'){ NET.rin={x:+m.x||0,y:+m.y||0,a:!!m.a}; }
    else if(m.t==='c'){
      const u=NET.ru; if(!u||!running||!G||G.over) return;
      if(m.k==='su'){ skillUp(u,m.i|0); return; }
      if(u.ko) return;
      if(m.k==='sd') skillDown(u,m.i|0); else if(m.k==='dg') tryDodge(u); else if(m.k==='fl') pressFlag(u);
    }
  } else {
    if(m.t==='start') guestStart(m);
    else if(m.t==='s' && G && NET.mode==='guest') netApplySnap(m);
    else if(m.t==='end') guestEnd(m);
    else if(m.t==='lobby'){ running=false; showLobby(); }
    else if(m.t==='mode'){ NET.vs=!!m.vs; lobbyStat(); }
  }
}
function netClosed(){
  if(NET.mode==='host'){
    NET.rin={x:0,y:0,a:false};
    if(running && NET.ru){ NET.ru.remote=false; NET.ru.nick=''; if(G) addText(NET.ru.x,NET.ru.y-110,'友達が切断(ボットに交代)','#ffffff',20,2); }
    NET.conn=null; NET.ru=null; if(!running) showLobby();
  } else if(NET.mode==='guest'){
    running=false; NET.conn=null;
    $('card').innerHTML=`<h1>切断されました</h1><p>ホストとの通信が切れました。</p><div class="btnrow"><button id="go" type="button">戻る</button></div>`;
    $('go').onclick=()=>{ netLeave(); showStart(); }; $('overlay').style.display='grid';
  }
}
function pickHtml(){
  return `<div class="pickbar"><span>キャラを選ぶ</span><span><button type="button" id="pL" aria-label="左へ">‹</button><button type="button" id="pR" aria-label="右へ">›</button></span></div>
    <div class="pick" id="pick">${['rubber','rubber2','swords','sanji','songkus','hikari','rubber3','hornkey','oh','kuro','fire','ryo'].map(charCard).join('')}</div>`;
}
function pickBind(onPick){
  $('card').querySelectorAll('.cc').forEach(b => b.onclick = () => {
    selected = b.dataset.c; $('card').querySelectorAll('.cc').forEach(x => x.classList.toggle('sel', x===b)); if(onPick) onPick(selected);
  });
  const pk=$('pick'); $('pL').onclick=()=>pk.scrollBy({left:-300,behavior:'smooth'}); $('pR').onclick=()=>pk.scrollBy({left:300,behavior:'smooth'});
  { const sl=pk.querySelector('.sel'); if(sl){ pk.scrollLeft=Math.max(0,sl.offsetLeft-12); pk.scrollTop=Math.max(0,sl.offsetTop-12); } }
}
const BTN = 'padding:12px 20px;border-radius:8px;border:2px solid var(--line);background:var(--sea2);font-family:var(--disp);font-size:16px;cursor:pointer;color:var(--ink)';
function showRoomMenu(){
  netLeave(); running=false;
  $('card').innerHTML = `<h1>ルーム<em>(友達と)</em></h1>
    <p>ルーム番号を決めて、友達に教えてください。友達は同じ番号を入れて「ルームに入る」を押します。同じチームで遊べます(残りはボット)。入ったあと、ホストが「友達と1v1」をONにすると、1対1で対戦できます。</p>
    <input id="roomNo" inputmode="numeric" maxlength="8" placeholder="ルーム番号(例: 1234)" style="font-size:22px;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--sea2);color:var(--ink);width:100%;box-sizing:border-box">
    <div class="btnrow"><button id="rmk" type="button" style="${BTN}">ルームを作る</button><button id="rjn" type="button" style="${BTN}">ルームに入る</button><button id="rbk" type="button" style="${BTN}">戻る</button></div>
    <p id="rmsg"></p>`;
  const num=()=>($('roomNo').value||'').replace(/[^0-9A-Za-z]/g,'').slice(0,8);
  $('rmk').onclick=()=>{ const n=num(); if(!n){ roomMsg('ルーム番号を入れてください','var(--foe)'); return; } netOpen(true,n); };
  $('rjn').onclick=()=>{ const n=num(); if(!n){ roomMsg('ルーム番号を入れてください','var(--foe)'); return; } netOpen(false,n); };
  $('rbk').onclick=()=>{ netLeave(); showStart(); };
  $('overlay').style.display='grid';
}
function lobbyStat(){
  const e=$('lstat'); if(!e) return;
  if(NET.mode==='host'){ const ok=NET.conn&&NET.conn.open; e.innerHTML = ok ? `友達が入室しました(キャラ: <b>${CH[NET.gchar].name}</b>)` : '友達の入室を待っています…'; e.style.color = ok?'var(--gold)':'var(--mute)'; const g=$('lgo'); if(g){ g.disabled=!ok; g.style.opacity=ok?1:.45; } }
  else { e.textContent='接続OK。ホストが出航するのを待っています…'+(NET.vs?'(今回は 1v1 で対戦します)':''); e.style.color='var(--gold)'; }
}
function showLobby(){
  const host=NET.mode==='host';
  $('card').innerHTML = `<h1>ルーム <em>${NET.room}</em></h1><p id="lstat"></p>${pickHtml()}
    <div class="btnrow">${host?`<button id="lgo" type="button" style="${BTN}">出航</button><button id="lvs" type="button" style="${BTN}"></button>`:''}<button id="lbk" type="button" style="${BTN}">ルームを出る</button></div>`;
  pickBind(c=>{ if(!host) netSend({t:'pick',c}); });
  if(host){ $('lgo').onclick=netHostStart;
    const vb=$('lvs'), pv=()=>{ vb.textContent='友達と1v1: '+(NET.vs?'ON':'OFF'); vb.style.borderColor=NET.vs?'var(--gold)':'var(--line)'; vb.style.color=NET.vs?'var(--gold)':'var(--ink)'; };
    pv(); vb.onclick=()=>{ NET.vs=!NET.vs; pv(); netSend({t:'mode',vs:!!NET.vs}); lobbyStat(); }; }
  $('lbk').onclick=()=>{ netLeave(); showStart(); };
  lobbyStat(); $('overlay').style.display='grid';
}
function netHostStart(){                                // ホスト: 試合を始めてゲストへ知らせる
  if(!NET.conn || !NET.conn.open) return;
  duel=false; NET.sent={}; NET.kf=0; NET.acc=0; NET.rin={x:0,y:0,a:false};
  NETH=[]; newGame(); running=true; $('overlay').style.display='none';
  NET.youId=NET.ru.id; NET.hostId=G.pl.id;
  netSend({t:'start', you:NET.youId, host:NET.hostId, snap:netSnapshot(true)});
}
function guestStart(m){
  NET.youId=m.you; NET.hostId=m.host; NET.sent={};
  G = {t:0, time:MATCH, units:[], events:[], rings:[], texts:[], strikes:[], proj:[], slow:0, score:[0,0], over:false, areas:[], obs:[], pulls:[]};
  netApplySnap(m.snap);
  G.pl = G.units.find(u=>u.id===NET.youId) || G.units[0];
  for(const u of G.units){ if(u.tx!==undefined){ u.x=u.tx; u.y=u.ty; } }
  cam.x=G.pl.x; cam.y=G.pl.y; NET.lastIn=''; NET.inAcc=0;
  setupButtons(); running=true; $('overlay').style.display='none';
}
function guestEnd(m){
  running=false; if(G && m.sc){ G.score=m.sc; }
  const my=(G.pl&&G.pl.team===1)?1:0, a=Math.floor(G.score[my]), b=Math.floor(G.score[1-my]), r=a>b?'勝利':a<b?'敗北':'引き分け';
  $('card').innerHTML = `<p style="letter-spacing:.2em">試合終了</p><h1 id="res" style="color:${a>b?'var(--gold)':a<b?'var(--foe)':'var(--ink)'}">${r}</h1>
    <div class="stats2"><span>味方<b style="color:var(--ally)">${a}</b></span><span>敵<b style="color:var(--foe)">${b}</b></span></div>
    <p>ホストが次の試合を始めるのを待っています…</p><div class="btnrow"><button id="go" type="button">ルームを出る</button></div>`;
  $('go').onclick=()=>{ netLeave(); showStart(); }; $('overlay').style.display='grid';
}
function loop(now){
  const dt = Math.min(.05,(now-last)/1000); last=now;
  if(G){ try{ if(running){ if(NET.mode==='guest') guestStep(dt); else { update(dt); if(NET.mode==='host') hostTick(dt); } } render(dt); hud(); }catch(err){ if(NET.mode==='guest'){ if(!NET.errLogged){ NET.errLogged=1; console.error(err); } } else throw err; } }
  requestAnimationFrame(loop);
}

/* ===== お知らせ: 画面の上から流れてくる「大切なお知らせ」(延期のお知らせ) ===== */
function initNotice(){
  const ov=$('overlay');
  const nb=document.createElement('div'); nb.id='notice';
  const line='★ セキュリティ上の理由により「パーティー編成・マルチプレイ」「ガシャ」の実装を延期します。安全が確認できしだいお知らせします。';
  nb.innerHTML=`<div class="nh">〜大切なお知らせ〜<b>タップで詳しく</b></div><div class="nm"><span>${line}　${line}</span></div>`;
  const md=document.createElement('div'); md.id='nmodal';
  md.innerHTML=`<div id="nbox" role="dialog" aria-label="大切なお知らせ">
    <h2>〜大切なお知らせ〜</h2>
    <div class="when">セキュリティ上の理由により<br><b style="color:var(--gold)">一部機能の実装を延期</b>します</div>
    <div class="cd">ユーザーの皆様の安全を最優先にした対応です</div>
    <div class="ni"><h3>経緯</h3>
      <p>システム全体のセキュリティ監視において、第三者による不正アクセスの可能性(またはその兆候)が検知されました。ユーザーの皆様の安全と個人情報の保護を第一に、現在、緊急の調査とセキュリティ対策の強化を行っています。</p></div>
    <div class="ni"><h3>延期する機能</h3>
      <p>安全性が完全に確認されるまでの間、以下の機能の実装を延期します。</p>
      <p>・パーティー編成 / マルチプレイ要素<br>・ガシャ(抽選システム)要素</p></div>
    <div class="ni"><h3>今後について</h3>
      <p>実装時期やスケジュールが決まりしだい、あらためてお知らせします。</p></div>
    <div class="ni"><h3>おわび</h3>
      <p>このような事態となり、誠に遺憾です。ご心配とご迷惑をおかけして申し訳ありません。ご理解とご協力をお願いいたします。</p></div>
    <button type="button" id="nclose">閉じる</button></div>`;
  ov.appendChild(nb); ov.appendChild(md);
  const close=()=>md.classList.remove('on');
  nb.onclick=()=>md.classList.add('on'); $('nclose').onclick=close; md.onclick=e=>{ if(e.target===md) close(); };
}
resize(); newGame(); initNotice(); showStart();
requestAnimationFrame(loop);
})();
