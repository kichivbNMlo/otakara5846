<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲーム暗号化ツール</title>
<style>
body{margin:0;padding:20px;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0b1620;color:#e8f0f6}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
p{color:#9db3c4;margin:6px 0 16px;font-size:14px}
label{display:block;margin:14px 0 4px;font-weight:700}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:2px solid #2a4258;background:#12263a;color:#e8f0f6}
button{width:100%;margin-top:18px;padding:14px;font-size:18px;font-weight:700;border-radius:8px;border:0;background:#f2b84b;color:#241700;cursor:pointer}
button:disabled{opacity:.5}
#msg{margin-top:16px;padding:12px;border-radius:8px;background:#12263a;font-size:15px;white-space:pre-wrap;display:none}
#msg.ok{border:2px solid #43e68a}#msg.ng{border:2px solid #ff5a64}
#dl{display:none;margin-top:14px;text-align:center;padding:14px;border-radius:8px;background:#43e68a;color:#06210f;font-weight:700;text-decoration:none}
</style></head><body><main>
<h1>ゲーム暗号化ツール</h1>
<p>ゲームのファイル(index.html)をパスワードで暗号化して、GitHubに置く用の <b>game.enc</b> を作ります。ファイルもパスワードも、この端末の外には送られません。</p>
<label for="f">① ゲームのファイル(index.html)</label>
<input id="f" type="file" accept=".html,text/html">
<label for="p">② パスワード(12文字以上)</label>
<input id="p" type="password" autocomplete="new-password">
<label for="p2">③ もう一度パスワード</label>
<input id="p2" type="password" autocomplete="new-password">
<button id="go" type="button">暗号化する</button>
<div id="msg"></div>
<a id="dl" download="game.enc">game.enc をダウンロード</a>
</main>
<script>
function toB64(u8){var s='';for(var i=0;i<u8.length;i+=0x8000){s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));}return btoa(s);}
async function encryptText(text,pw){
  var N=200000, salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:N,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({v:1,n:N,s:toB64(salt),i:toB64(iv),d:toB64(ct)});
}
(function(){
  var $=function(id){return document.getElementById(id);};
  function say(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'ng';m.style.display='block';}
  $('go').onclick=async function(){
    $('dl').style.display='none';
    var f=$('f').files[0], p=$('p').value, p2=$('p2').value;
    if(!f) return say('ゲームのファイルを選んでください',false);
    if(p.length<12) return say('パスワードは12文字以上にしてください',false);
    if(p!==p2) return say('パスワードが2回で違います',false);
    if(!window.crypto||!crypto.subtle) return say('このページでは暗号化が使えません。https:// で始まるURLから開いてください',false);
    $('go').disabled=true; say('暗号化しています…',true);
    try{
      var text=await f.text();
      if(text.indexOf('<canvas')<0) throw new Error('ゲームのファイルではないようです');
      var out=await encryptText(text,p);
      var url=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));
      var a=$('dl'); a.href=url; a.style.display='block';
      say('できました!下の緑のボタンで game.enc を保存して、GitHubにアップロードしてください。\nパスワードは忘れないようにしてください(忘れると開けません)。',true);
    }catch(e){ say('失敗しました: '+(e&&e.message||e),false); }
    $('go').disabled=false;
  };
})();
</script></body></html>
